<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakura Gateway · 控制台</title>
<!-- Self-hosted fonts stay as static files (referenced by the sakura-fonts.css
     in llm-gateway/static/, relative url("fonts/...") → /static/fonts/...). -->
<link rel="stylesheet" href="/static/sakura-fonts.css">
<script>
/* Theme boot injector: re-apply the cached theme manifest before first paint
   so there's no flash of the wrong theme. The React app re-applies from the
   server's /api/themes once loaded (this is only a fast path). */
(function () {
  var meta = null;
  try { meta = JSON.parse(localStorage.getItem('sakura-theme-manifest') || 'null'); } catch (e) {}
  if (!meta || !meta.id) {
    // migrate the pre-theme-system light/dark preference
    var old = null;
    try { old = localStorage.getItem('theme'); } catch (e) {}
    meta = { id: old === 'light' ? 'sakura-light' : 'sakura-dark', mode: old === 'light' ? 'light' : 'dark', css: ['theme.css'] };
  }
  document.documentElement.dataset.theme = meta.mode || 'dark';
  // Layering: the mode's base theme (sakura-light/dark) goes UNDER the theme's
  // own css, so partial themes overriding only a few tokens still render fine.
  var baseId = (meta.mode === 'light') ? 'sakura-light' : 'sakura-dark';
  var hrefs = [];
  if (meta.id !== baseId) hrefs.push('/themes/' + encodeURIComponent(baseId) + '/theme.css');
  var base = '/themes/' + encodeURIComponent(meta.id) + '/';
  (meta.css || ['theme.css']).forEach(function (f) { hrefs.push(base + f); });
  hrefs.forEach(function (href) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = href;
    l.setAttribute('data-theme-css', '');
    document.head.appendChild(l);
  });
})();
</script>

  <link rel="stylesheet" crossorigin href="/static/assets/index-CxRUd_wn.css">
</head>
<body>
<div id="root"></div>
</body>
</html>
