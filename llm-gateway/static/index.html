   every prototype render function below reads them unchanged. The prototype's
   inline mock literals are replaced by adapters mapping the real API responses
   into these same shapes. Fields with no real backend are kept (per the agreed
   rule) but bound to 0 / '' / Infinity so nothing is faked. */

/* ============ api helper ============ */
async function api(method, url, body){
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok){ let msg = ''+r.status; try { const e = await r.json(); if (e && e.error) msg = e.error; } catch(_){} throw new Error(msg); }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
function copyText(s){
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s).catch(()=>{}); }
  else { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); }
}
function toast(msg){ const m = $('msg'); if(!m) return; m.textContent = msg; m.classList.add('show'); clearTimeout(m._t); m._t = setTimeout(()=>m.classList.remove('show'), 2600); }

/* ============ route preview (server dry-run, mapped to the prototype shape) ============
   The prototype computed this client-side over KEYS; the real gateway selects
   server-side (spec §3-§6), so computeRoute() now returns the cached result of
   POST /api/strategy/dry-run (mapped into {state, winner, cand, retry} so the
   prototype's renderStrategy + resultBanner stay byte-identical). */
function computeRoute(){
  return RES || { state:'429-empty', cand:[] };
}
function modeName(){
  const { groupLock, provLock } = S;
  if (groupLock && provLock)  return '精确 (provider,model) 轮换 Key - 当前行为，零惊喜';
  if (groupLock && !provLock) return '模型优先 - 跨提供商同模型';
  if (!groupLock && provLock) return '提供商优先 - 换模型';
  return '可用优先 - 所有候选';
}

/* ============ render: shell ============ */
function renderSidebar(){
  const h = $('side-head-text'); if(h) h.textContent = t('导航');
  $('side-nav').innerHTML = TABS.map(tb => `
    <button class="side-item ${S.tab===tb.id?'active':''}" onclick="setTab('${tb.id}')" title="${t(tb.label)}">
      <svg viewBox="0 0 24 24">${ICONS[tb.id]}</svg>
      <span class="side-label">${t(tb.label)}</span>
    </button>`).join('');
  renderBottomNav();
}
// Mobile bottom tab bar (shown ≤560px via CSS): same tabs as the sidebar, fixed at
// the bottom instead of the left icon-rail — bigger touch targets + frees content
// width. Hidden on wide viewports (the sidebar is used there).
function renderBottomNav(){
  const bn = $('bottom-nav'); if(!bn) return;
  bn.innerHTML = TABS.map(tb => `
    <button class="bn-item ${S.tab===tb.id?'active':''}" onclick="setTab('${tb.id}')" aria-label="${t(tb.label)}" title="${t(tb.label)}">
      <svg viewBox="0 0 24 24">${ICONS[tb.id]}</svg>
      <span class="bn-label">${t(tb.label)}</span>
    </button>`).join('');
}
function setTab(id){ S.tab=id; if(id!=='models') S.editingModel=null; renderSidebar(); renderMain(); }
function setLocalProv(id){ S.localProv=id; S.addState=null; renderMain(); }

/* ============ render: main dispatcher ============ */
function renderMain(){
  const m = $('main');
  if (!STATUS) { m.innerHTML = ''; return; }
  if (S.tab==='providers') renderProviders(m);
  else if (S.tab==='models') renderModels(m);
  else if (S.tab==='strategy') renderStrategy(m);
  else if (S.tab==='apikeys') renderApiKeys(m);
  else if (S.tab==='stats') renderStats(m);
  else if (S.tab==='settings') renderSettings(m);
  renderSideFoot();
}

function provRateToggle(id, field, live){

  S.addState='form'; renderMain();

function addDraftModel(){
  const inp=document.getElementById('add-model-input'); if(!inp) return;
  const v=inp.value.trim(); if(v && !S.addDraft.models.includes(v)) S.addDraft.models.push(v);
  inp.value=''; renderMain();
}
function removeDraftModel(i){ S.addDraft.models.splice(i,1); renderMain(); }
function refreshAddBtn(){
  const d=S.addDraft; const b=document.getElementById('add-commit');
  if(b&&d) b.disabled = !(d.name.trim()&&d.base_url.trim()&&d.key.trim());
}
async function commitAdd(){
  const d = S.addDraft;
  if(!d || !d.name.trim() || !d.base_url.trim() || !d.key.trim()) return;
  try {
    const cfg = await api('POST', '/api/providers', { name:d.name.trim(), base_url:d.base_url.trim().replace(/\/+$/,''), protocol:d.protocol });
    const prov = (cfg.providers||[]).find(x=>x.name===d.name.trim());
    if (!prov) throw new Error('provider create failed');
    const pid = prov.id;
    await api('POST', '/api/providers/'+pid+'/keys', { key:d.key.trim(), label:'' });
    for (const mId of d.models){ try { await api('POST', '/api/providers/'+pid+'/models', { id:mId }); } catch(e){ /* ignore duplicate-model conflicts */ } }
    S.addState=null; S.addDraft=null; S.localProv=pid;
    await refresh(); toast(t('添加成功'));
  } catch(e){ console.error('commitAdd', e); toast(t('添加失败: ')+e.message); }
}

async function saveModelEdit(idx){
  const mo = MODELS[idx]; if(!mo) return;

  const outPrice = isNaN(ov) ? 0 : ov;

  const p = (STATUS.providers||[]).find(x=>x.id===mo.prov);

    await api('PUT', '/api/providers/'+mo.prov+'/models/'+encodeURIComponent(mo.id)+'/context-length', { context_length: ctxTokens });

// (pid:model) already used by other groups (excl. the one being edited) and by
// the current draft's other rows — those models are greyed (disabled) in the
// per-row model dropdown. Each model may belong to exactly one group.
function groupOccupied(rowIndex){
  const e = S.groupEdit;
  const editingName = e.isNew ? null : (GROUPS[e.index] ? GROUPS[e.index].name : null);
  const taken = new Set();
  GROUPS.forEach(g => {
    if (g.name === editingName) return;
    (g.members||[]).forEach(m => taken.add(m.prov+':'+m.model));
  });
  (e.entries||[]).forEach((en, i) => {
    if (i === rowIndex) return;
    if (en.pid && en.model) taken.add(en.pid+':'+en.model);
  });
  return taken;
}

async function fetchUpstreamModels(btn){
  const sel = document.querySelector('.mf-row select');

  if (!pid){ toast(t('请先选择提供商')); return; }

  try { const r = await api('GET', '/api/providers/'+pid+'/upstream-models'); models = r.models || []; }
  catch(e){ btn.disabled=false; btn.textContent=old; toast(t('拉取失败: ')+e.message); return; }
  btn.disabled = false; btn.textContent = old;
  if (!models.length){ toast(t('上游未返回任何模型')); return; }

  catch(e){ toast(t('失败: ')+e.message); return; }
  await refresh();
  toast(t('新添加 {n} 个模型').replace('{n}', n));
}

    return `<div class="result-banner err429"><span class="big">${t('429 无可用')}</span> ${t('候选 {n} 条均无效').replace('{n}',res.cand.length)}</div>`;

async function onFilterChange(){
  const checks = document.querySelectorAll('.toggle-row input[type=checkbox]');
  S.groupLock = checks[0] ? checks[0].checked : S.groupLock;

async function putStrategy(){
  try {
    await api('PUT', '/api/strategy', { filter:{ lock_model_group:S.groupLock, lock_provider:S.provLock }, sort:S.sorts.filter(Boolean) });
    STRATEGY = await api('GET', '/api/strategy');
    S.groupLock = STRATEGY.filter.lock_model_group; S.provLock = STRATEGY.filter.lock_provider;
    S.sorts = [STRATEGY.sort[0]||'', STRATEGY.sort[1]||'', STRATEGY.sort[2]||''];
  } catch(e){ console.error('putStrategy', e); toast(t('失败: ')+e.message); }
}
async function runDryRun(){
  if (!S.reqModel) return;
  try {
    const d = await api('POST', '/api/strategy/dry-run', {
      model: S.reqModel,
      provider: S.reqProv || undefined,
      sorts: S.sorts.filter(Boolean)
    });
    DRY = d;
    // map the server terminal + candidates into the prototype's computeRoute shape
    const cand = (d.candidates||[]).map(k => ({
      routed: k.routed,
      kid: k.api_key_id, prov: k.provider_id, model: k.upstream_model,
      valid: k.valid, cool: !k.non_cooled, cd: k.remaining_secs||0,
      price: k.price||0, tps: k.tps||0, sr: k.success_rate||0
    }));
    let winner = null;
    for (const k of cand) if (k.routed) winner = k;
    let state, retry;
    if (d.result==='routed') state='routed';
    else if (d.result==='all_cooling'){ state='429-retry'; retry=d.retry_after; }
    else if (d.result==='no_valid') state='429-novalid';
    else state='429-empty';
    RES = { state, winner, cand, retry };
  } catch(e){ RES = null; console.error('runDryRun', e); }
}

/* ---------- api key live status (5s poll, spec: 数据 5s 更新) ---------- */
// A full refresh() every second would re-render the whole page, reset the key
// show/hide toggles, and disrupt the seed editor / add-key input mid-typing.
// Instead: fetch only /api/status, re-adapt KEYS, then surgically patch the
// changing cells of each row — never touching the Key cell (preserves the
// 显示/隐藏 toggle), the seed card, or any input. Filter-membership changes
// (a key cooling/recovering) are re-synced on the next full render (any
// action) or by re-clicking a filter chip.
async function refreshAkStatus(){
  if (S.tab !== 'apikeys' || document.hidden) return;
  try {
    STATUS = await api('GET', '/api/status');
    adaptAll();
    updateAkCells();
  } catch(e){ /* transient; next tick retries */ }
}
function updateAkCells(){
  document.querySelectorAll('span[data-ak]').forEach(span => {
    const k = KEYS.find(x => x.kid === span.dataset.ak);
    if (!k) return;
    const tr = span.closest('tr'); if (!tr) return;
    const c = tr.children;
    // cols: 0 Key(untouched) 1 提供商 2 智能冷却时长 3 状态 4 token余额 5 账单 6 请求数 7 最近错误 8 操作
    if (c[2]) c[2].innerHTML = k.cdDur + 's';
    if (c[3]) c[3].innerHTML = keyStatus(k);
    if (c[4]) c[4].innerHTML = k.tb===Infinity ? `<span class="faint">${t('不限')}</span>` : k.tb.toLocaleString();
    if (c[5]) c[5].innerHTML = k.bb===Infinity ? `<span class="faint">${t('不限')}</span>` : '¥'+k.bb;
    if (c[6]) c[6].textContent = String(k.req||0);
    if (c[7]) c[7].innerHTML = `<span class="ak-err" title="${esc(k.lastErr||'-')}">${esc(k.lastErr||'-')}</span>`;
  });
}

/* ---------- stats live refresh (5s poll, spec: 数据 5s 更新) ---------- */
// Display-only panel (totals + 24h histogram + per-provider/key/model tables),
// so a full re-render of the stats panel every 5s is safe — no inputs to disrupt.
// Self-guards: only fetches on the Stats tab and when the page is visible.
async function refreshStats(){
  if (S.tab !== 'stats' || document.hidden) return;
  try {
    STATS = await api('GET', '/api/stats');
    adaptAll();
    renderStats($('main'));
  } catch(e){ /* transient; next tick retries */ }
}
/* ---------- api key smooth countdown (1s local tick, no fetch) ---------- */
// Data is fetched every 5s (refreshAkStatus), but the cooldown countdown must
// decrement smoothly every second. Each cooling key carries untilMs (the
// server's absolute expiry timestamp from /api/status); this tick recomputes
// cd = ceil((untilMs - Date.now())/1000) and patches only the status cell.
// When a cooldown reaches 0 it triggers one debounced refreshAkStatus to
// re-sync with the server (which authoritatively flips 可用 or re-cools).
function tickAkCountdown(){
  if (S.tab !== 'apikeys' || document.hidden) return;
  const now = Date.now();
  let anyExpired = false;
  document.querySelectorAll('span[data-ak]').forEach(span => {
    const k = KEYS.find(x => x.kid === span.dataset.ak);
    if (!k || !k.cool || !k.untilMs) return;
    const tr = span.closest('tr'); if (!tr) return;
    const cd = Math.max(0, Math.ceil((k.untilMs - now) / 1000));
    if (cd === k.cd) return;
    k.cd = cd;
    const c = tr.children;
    if (c[3]) c[3].innerHTML = keyStatus(k);
    if (cd === 0) anyExpired = true;
  });
  if (anyExpired && !S._akSyncing) {
    S._akSyncing = true;
    refreshAkStatus().finally(() => { S._akSyncing = false; });
  }
}

      </div>
    </div>

          <button onclick="document.getElementById('import-file').click()">${t('导入配置')}</button>
          <button onclick="document.getElementById('import-legacy-file').click()">${t('导入旧版配置')}</button>
          <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importConfig(event)">
          <input type="file" id="import-legacy-file" accept=".json,application/json" style="display:none" onchange="importLegacyConfig(event)">
        </div>
        <div class="faint" style="font-size:0.75rem;margin-top:0.625rem">${t('gateway.json · 导入即时热生效')}</div>
        <div class="faint" style="font-size:0.75rem">${t('旧版导入：仅采纳提供商/Key/模型/智能冷却，保留当前全局设置')}</div>
      </div>
    </div>`;
}
async function saveSettings(){
  try {
    await api('PUT', '/api/settings', {
      default_cooldown_secs: +$('s-cooldown').value || 60,
      max_attempts: +$('s-attempts').value || 3,
      api_port: +$('s-apiport').value || 8000,
      ui_port: +$('s-uiport').value || 8001,
      auth: { enabled: $('s-auth').checked, keys: $('s-authkeys').value.split(',').map(s=>s.trim()).filter(Boolean) }
    });
    await refresh(); toast(t('已保存'));
  } catch(e){ console.error('saveSettings', e); toast(t('失败: ')+e.message); }
}
function exportConfig(){ window.open('/api/config/export', '_blank'); toast(t('已触发下载')); }
async function importConfig(ev){
  const file = ev.target.files[0]; ev.target.value=''; if (!file) return;
  if (!confirm(t('导入 {n} 将整体替换当前配置（含端口与鉴权设置），确定继续？').replace('{n}', file.name))) return;
  try {
    const content = await file.text(); JSON.parse(content);
    await api('POST', '/api/config/import', { content });
    await refresh(); toast(t('导入成功'));
  } catch(e){ console.error('importConfig', e); toast(t('导入失败: ')+e.message); }
}
async function importLegacyConfig(ev){
  // Selective merge: adopt only the imported config's providers (which carry
  // keys + models + learned_cooldown). Keep the current global settings (ports/
  // auth/cooldown/strategy/model_groups) untouched. For migrating a pre-UI-refactor
  // gateway config into the current one without clobbering local settings.
  const file = ev.target.files[0]; ev.target.value=''; if (!file) return;
  if (!confirm(t('导入旧版配置 {n}？仅采纳提供商/Key/模型/智能冷却，保留当前全局设置。').replace('{n}', file.name))) return;
  try {
    const content = await file.text(); JSON.parse(content);
    await api('POST', '/api/config/import-legacy', { content });
    await refresh(); toast(t('导入成功'));
  } catch(e){ console.error('importLegacyConfig', e); toast(t('导入失败: ')+e.message); }
}

/* ============ adapters: real API responses → prototype mock shapes ============ */
function adaptAll(){
  const provs = (STATUS && STATUS.providers) || [];
  PROVIDERS = provs.map(p => ({
    id: p.id, name: p.name, base: p.base_url, proto: p.protocol || 'openai',
    // no per-provider token/bill/quota backend: unlimited / 0 / empty (not faked)
    tb: Infinity, bb: Infinity, rpm: 0, tpm: 0, resetAt: '', resetQuota: 0,
    rpmLimit: (p.rpm_limit!=null) ? p.rpm_limit : null,
    tpmLimit: (p.tpm_limit!=null) ? p.tpm_limit : null,
    // server-side detected metrics (live aggregate, or persisted after a restart
    // until new traffic overrides — see state.rs detected_metrics_for).
    detectedMetrics: p.detected_metrics || null,
    dot: 'var(--color-action-primary)'
  }));
  MODELS = []; KEYS = [];
  provs.forEach(p => {
    (p.models || []).forEach(m => {
      const aliases = Object.keys(p.aliases || {}).filter(a => (p.aliases || {})[a] === m.id);
      const price = (p.price_table && p.price_table[m.id] != null) ? p.price_table[m.id] : 0;
      const outPrice = (p.output_price_table && p.output_price_table[m.id] != null) ? p.output_price_table[m.id] : 0;
      const tftt = (STATS && STATS.models && STATS.models[m.id]) ? (STATS.models[m.id].avg_tftt_ms || 0) : 0;
      const tps = (STATS && STATS.models && STATS.models[m.id]) ? (STATS.models[m.id].avg_tps || 0) : 0;
      MODELS.push({ id: m.id, prov: p.id, up: m.id, pIn: price, pOut: outPrice, ctx: (m.context_length||0), on: m.enabled, alias: aliases, tftt, tps });
    });
    (p.keys || []).forEach(k => {
      const mt = k.metrics || {};
      const now = STATUS.now_ms || 0;
      const cd = k.cooling ? Math.max(0, Math.ceil((k.cooling.until_ms - now) / 1000)) : 0;
      KEYS.push({
        kid: k.id, prov: p.id, model: '-',
        valid: !k.invalid, cool: !!k.cooling, cd,
        untilMs: k.cooling ? k.cooling.until_ms : 0,
        // 智能冷却时长 (生效值, spec §7 + 偏离②保留链): learned → per-key
        // cooldown_secs → global default. Always a number (default always set).
        cdDur: k.learned_cooldown != null ? k.learned_cooldown
             : (k.cooldown_secs != null ? k.cooldown_secs
             : (STATUS.default_cooldown_secs != null ? STATUS.default_cooldown_secs : 0)),
        // masked key (status exposes mask(&k.key) = prefix+••••+suffix); shown
        // in the seed-edit card title and (later) the table's hidden state.
        masked: k.key || '••••',
        sr: mt.success_rate || 0, rpm: mt.rpm || 0, tpm: mt.tpm || 0, tftt: mt.avg_tftt_ms || 0,
        tb: mt.token_balance == null ? Infinity : mt.token_balance,
        bb: mt.bill_balance == null ? Infinity : mt.bill_balance,
        price: 0, tps: mt.tps || 0, lastErr: k.last_error || '',
        req: k.requests || 0,
        // spec §2.2 seed: preset initial values (null = none / clear).
        seedRpm: k.seed_rpm, seedTpm: k.seed_tpm, seedSr: k.seed_success_rate,
        seedTftt: k.seed_avg_tftt_ms, seedTps: k.seed_tps
      });
    });
  });
  // RPM/TPM display value: a manual cap if set, else the server-detected value
  // (live aggregate, or the persisted value after a restart until new traffic
  // overrides). Read-only in the detail panel when no manual cap is set.
  PROVIDERS.forEach(pr => {
    const dm = pr.detectedMetrics || {rpm:0,tpm:0};
    pr.rpm = (pr.rpmLimit!=null) ? pr.rpmLimit : dm.rpm;
    pr.tpm = (pr.tpmLimit!=null) ? pr.tpmLimit : dm.tpm;
  });
  GROUPS = (MODEL_GROUPS || []).map(g => ({ name: g.id, members: (g.entries || []).map(e => ({ prov: e[0], model: e[1] })) }));
}

/* ============ refresh: load real data + adapt + dry-run + render ============ */
async function refresh(){
  try {
    STATUS = await api('GET', '/api/status');
    STATS = await api('GET', '/api/stats');
    const cat = await api('GET', '/api/free-catalog'); CATALOG = (cat && cat.providers) || [];
    STRATEGY = await api('GET', '/api/strategy');
    MODEL_GROUPS = await api('GET', '/api/model-groups') || [];
    adaptAll();
    // mirror the saved strategy into the UI state (edits PUT immediately)
    S.groupLock = STRATEGY.filter.lock_model_group;
    S.provLock = STRATEGY.filter.lock_provider;
    S.sorts = [STRATEGY.sort[0]||'', STRATEGY.sort[1]||'', STRATEGY.sort[2]||''];
    if (!S.reqModel && MODELS.length) S.reqModel = MODELS[0].id;
    if (!S.reqProv && PROVIDERS.length) S.reqProv = PROVIDERS[0].id;
    await runDryRun();
    renderTopbar(); renderSideFoot(); renderMain();
  } catch(e){ /* transient; next tick retries */ }
}

$('theme-toggle').addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light'));
$('hamburger').addEventListener('click',()=>{
  S.collapsed = !S.collapsed;
  $('sidebar').classList.toggle('collapsed', S.collapsed);
});

/* ============ boot ============ */
S.lang = localStorage.getItem('lang')==='en' ? 'en' : 'zh';
applyTheme(localStorage.getItem('theme')==='light' ? 'light' : 'dark');
renderTopbar(); renderSidebar(); renderMain();
refresh();
// Live refresh cadence: API Key + Stats panels fetch every 5s (self-guarded to
// their tab + page-visible). The API Key cooldown countdown additionally ticks
// every 1s locally (no fetch) off each key's untilMs absolute timestamp, so it
// decrements smoothly; reaching 0 triggers one debounced refreshAkStatus.
setInterval(refreshAkStatus, 5000);
setInterval(refreshStats, 5000);
setInterval(tickAkCountdown, 1000);
