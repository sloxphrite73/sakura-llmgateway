<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakura Gateway · 控制台</title>
<style>
  :root {
    --bg: #0d0e13;
    --panel: #15161d;
    --panel-2: #1a1c25;
    --border: #262936;
    --border-strong: #343848;
    --text: #e9e7e4;
    --muted: #9298a8;
    --faint: #5d6373;
    --sakura: #f2a6b8;
    --sakura-dim: #b9768c;
    --ok: #7fc9a2;
    --warn: #e0b072;
    --err: #e08a8a;
    --radius: 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
    padding: 0 0 64px;
    min-height: 100vh;
  }
  a { color: var(--sakura); }

  /* ---------- masthead ---------- */
  .masthead {
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    padding: 20px 28px 18px;
    display: flex;
    align-items: baseline;
    gap: 18px;
    flex-wrap: wrap;
  }
  .masthead h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .masthead h1 .petal {
    display: inline-block;
    width: 9px; height: 9px;
    background: var(--sakura);
    border-radius: 50% 0 50% 50%;
    margin-right: 10px;
    transform: rotate(-45deg);
  }
  .masthead .api-line {
    color: var(--muted);
    font-size: 13px;
    margin-left: auto;
  }
  .masthead .api-line code { color: var(--sakura); }

  .wrap { max-width: 980px; margin: 0 auto; padding: 0 28px; }

  /* ---------- sections ---------- */
  .section { margin-top: 28px; }
  .section > .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.05em;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .section-title .note { font-weight: 400; color: var(--faint); font-size: 12px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-top: 12px;
  }
  .card-pad { padding: 16px 18px; }

  /* ---------- forms ---------- */
  input, button, select {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 7px 10px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  input::placeholder { color: var(--faint); }
  input:focus { border-color: var(--sakura-dim); }
  input[type="checkbox"] { accent-color: var(--sakura); width: auto; }
  button {
    cursor: pointer;
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text);
    transition: border-color .15s, color .15s, background .15s;
  }
  button:hover { border-color: var(--sakura-dim); color: var(--sakura); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--sakura); outline-offset: 2px; }
  button.primary { background: var(--sakura); border-color: var(--sakura); color: #1a0d12; font-weight: 600; }
  button.primary:hover { background: #f6bcc9; color: #1a0d12; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  button.small { padding: 3px 9px; font-size: 12px; }
  button:disabled { opacity: .45; cursor: default; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }

  /* ---------- tables ---------- */
  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  td, th { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  th {
    color: var(--faint);
    font-weight: 500;
    font-size: 12px;
    border-bottom: 1px solid var(--border-strong);
  }
  td.num { font-variant-numeric: tabular-nums; }

  .keytag {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 7px;
  }
  .st { font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .st.ok { color: var(--ok); } .st.ok::before { background: var(--ok); }
  .st.cool { color: var(--warn); } .st.cool::before { background: var(--warn); }
  .st.off { color: var(--err); } .st.off::before { background: var(--err); }
  .err-cell { color: var(--err); font-size: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .provider-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 18px 12px; }
  .provider-head h3 { font-size: 15px; font-weight: 600; }
  .provider-head .base-url { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--faint); margin-top: 2px; }
  .divider { border-top: 1px solid var(--border); }
  .pad { padding: 12px 18px; }

  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }

  .pill {
    font-size: 11px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 1px 9px;
    color: var(--muted);
  }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(6, 7, 10, .72);
    display: flex; align-items: center; justify-content: center;
    z-index: 10; padding: 20px;
  }
  .overlay .box {
    background: var(--panel);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    width: 440px; max-width: 100%;
    max-height: 72vh; overflow: auto;
    padding: 18px;
  }
  .overlay h3 { font-size: 15px; margin-bottom: 10px; }

  /* ---------- toast ---------- */
  .msg {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--panel-2);
    border: 1px solid var(--sakura-dim);
    color: var(--text);
    padding: 10px 16px;
    border-radius: var(--radius);
    display: none;
    max-width: 420px;
    box-shadow: 0 4px 24px rgba(0,0,0,.4);
  }
  code {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 3px;
  }

  @media (max-width: 640px) {
    .masthead { padding: 16px 18px; }
    .wrap { padding: 0 18px; }
    .masthead .api-line { margin-left: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header class="masthead">
  <h1><span class="petal" aria-hidden="true"></span>Sakura Gateway</h1>
  <div class="api-line">OpenAI 兼容接口 <code id="api-url">…</code> · 模型用 <code>provider/model</code> 或别名</div>
</header>

<main class="wrap">

  <section class="section">
    <h2 class="section-title">全局设置 <span class="note">端口修改后重启生效</span></h2>
    <div class="card">
      <div class="card-pad">
        <div class="settings-grid">
          <label class="f">默认冷却时间（秒）<input id="s-cooldown" type="number" min="1"></label>
          <label class="f">每请求最大尝试次数<input id="s-attempts" type="number" min="1" max="10"></label>
          <label class="f">API 端口<input id="s-apiport" type="number"></label>
          <label class="f">UI 端口<input id="s-uiport" type="number"></label>
        </div>
        <div class="row" style="margin-top:14px">
          <label class="row" style="gap:6px"><input type="checkbox" id="s-auth"> 启用本地 API 鉴权</label>
          <input id="s-authkeys" placeholder="鉴权 Key，逗号分隔" style="flex:1;min-width:240px">
          <button class="primary" onclick="saveSettings()">保存设置</button>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">提供商</h2>
    <div id="providers"></div>

    <div class="card">
      <div class="provider-head">
        <div><h3>添加提供商</h3></div>
      </div>
      <div class="pad divider row">
        <input id="np-name" placeholder="名称，如 openai">
        <input id="np-url" placeholder="Base URL，如 https://api.openai.com/v1" style="flex:1;min-width:280px">
        <button class="primary" onclick="addProvider()">添加</button>
      </div>
    </div>
  </section>

</main>

<div class="msg" id="msg" role="status"></div>

<script>
const $ = id => document.getElementById(id);
let STATUS = null;

async function api(method, url, body) {
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.error || r.status); }
  return r.json();
}
function toast(t) { const m = $('msg'); m.textContent = t; m.style.display='block'; setTimeout(()=>m.style.display='none', 2500); }
function esc(s) { return String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }

async function refresh() {
  STATUS = await api('GET', '/api/status');
  $('api-url').textContent = `http://127.0.0.1:${STATUS.api_port}/v1`;
  $('s-cooldown').value = STATUS.default_cooldown_secs;
  $('s-attempts').value = STATUS.max_attempts;
  $('s-apiport').value = STATUS.api_port;
  $('s-uiport').value = STATUS.ui_port;
  $('s-auth').checked = STATUS.auth.enabled;
  $('s-authkeys').value = (STATUS.auth.keys || []).join(',');
  render();
}

async function saveSettings() {
  try {
    await api('PUT', '/api/settings', {
      default_cooldown_secs: +$('s-cooldown').value || 60,
      max_attempts: +$('s-attempts').value || 3,
      api_port: +$('s-apiport').value || 8000,
      ui_port: +$('s-uiport').value || 8001,
      auth: { enabled: $('s-auth').checked, keys: $('s-authkeys').value.split(',').map(s=>s.trim()).filter(Boolean) }
    });
    toast('已保存'); refresh();
  } catch (e) { toast('失败: ' + e.message); }
}

function render() {
  $('providers').innerHTML = STATUS.providers.map(p => `
  <div class="card" data-pid="${p.id}">
    <div class="provider-head">
      <div>
        <h3>${esc(p.name)}</h3>
        <div class="base-url">${esc(p.base_url)}</div>
      </div>
      <div class="row">
        ${p.model_allowlist_only ? '<span class="pill">白名单</span>' : ''}
        <button class="small" onclick="renameProvider('${p.id}')">编辑</button>
        <button class="small danger" onclick="delProvider('${p.id}')">删除</button>
      </div>
    </div>

    <table class="divider">
      <tr><th>API Key</th><th>状态</th><th>冷却配置</th><th>请求数</th><th>最近错误</th><th></th></tr>
      ${p.keys.length ? p.keys.map(k => {
        const c = k.cooling;
        // Live countdown from the server's absolute until_ms; flips to 可用 at 0.
        const st = c
          ? `<span class="st cool" data-until="${c.until_ms}">冷却 · 剩余 ${Math.max(0, Math.ceil((c.until_ms - STATUS.now_ms)/1000))}s</span>`
          : `<span class="st ok">可用</span>`;
        return `<tr>
          <td><span class="keytag">${esc(k.label || k.key)}</span></td>
          <td>${st}</td>
          <td class="num">${k.cooldown_secs ?? '默认'}</td>
          <td class="num">${k.requests}</td>
          <td class="err-cell" title="${esc(k.last_error||'')}">${esc(k.last_error||'—')}</td>
          <td class="row">
            ${c ? `<button class="small" onclick="clearCooldown('${k.id}')">解除冷却</button>` : ''}
            <button class="small danger" onclick="delKey('${p.id}','${k.id}')">删除</button>
          </td></tr>`;
      }).join('') : `<tr><td colspan="6" class="faint">还没有 Key，添加第一把后这个提供商才能服务请求</td></tr>`}
    </table>
    <div class="pad divider row">
      <input placeholder="API Key" id="nk-${p.id}" style="flex:1;min-width:200px">
      <input placeholder="备注（可选）" id="nl-${p.id}" style="width:130px">
      <input placeholder="冷却秒（可选）" id="nc-${p.id}" type="number" style="width:120px">
      <button onclick="addKey('${p.id}')">添加 Key</button>
    </div>

    <div class="pad divider">
      <div class="row" style="justify-content:space-between">
        <div class="row">
          <span style="font-weight:600">模型</span>
          <span class="faint" style="font-size:12px">${p.models.length ? p.models.length + ' 个' : '未托管 · 放行所有模型'}</span>
        </div>
        <div class="row">
          <label class="row" style="gap:5px;font-size:12px;color:var(--muted)" title="开启后仅允许请求列表内的模型">
            <input type="checkbox" ${p.model_allowlist_only ? 'checked' : ''} onchange="setAllowlist('${p.id}', this.checked)"> 仅允许列表内模型
          </label>
          <button class="small" onclick="fetchUpstreamModels('${p.id}')">从上游拉取</button>
        </div>
      </div>
      ${p.models.length ? `<table style="margin-top:8px">
        <tr><th>模型 ID</th><th>状态</th><th></th></tr>
        ${p.models.map(m => `<tr>
          <td><span class="keytag">${esc(m.id)}</span></td>
          <td>${m.enabled ? '<span class="st ok">启用</span>' : '<span class="st off">已禁用</span>'}</td>
          <td class="row">
            <button class="small" onclick="toggleModel('${p.id}','${esc(m.id)}')">${m.enabled ? '禁用' : '启用'}</button>
            <button class="small danger" onclick="delModel('${p.id}','${esc(m.id)}')">删除</button>
          </td></tr>`).join('')}
      </table>` : ''}
      <div class="row" style="margin-top:10px">
        <input placeholder="模型 ID，如 gpt-4o" id="nm-${p.id}" style="flex:1;min-width:200px">
        <button onclick="addModel('${p.id}')">添加模型</button>
      </div>
    </div>

    <div class="pad divider row">
      <span class="faint" style="font-size:12px">别名</span>
      ${Object.entries(p.aliases).map(([a,m]) => `<span class="keytag">${esc(a)} → ${esc(m)} <a href="#" style="color:var(--err);text-decoration:none" onclick="delAlias('${p.id}','${esc(a)}');return false"> ✕</a></span>`).join('') || '<span class="faint" style="font-size:12px">无</span>'}
      <input placeholder="别名" id="al-${p.id}" style="width:110px">
      <input placeholder="上游模型名" id="am-${p.id}" style="width:150px">
      <button class="small" onclick="addAlias('${p.id}')">添加别名</button>
    </div>
  </div>`).join('');
}

async function addProvider() {
  try { await api('POST', '/api/providers', { name: $('np-name').value, base_url: $('np-url').value }); $('np-name').value=''; $('np-url').value=''; refresh(); }
  catch(e){ toast(e.message); }
}
async function renameProvider(id) {
  const p = STATUS.providers.find(x=>x.id===id);
  const name = prompt('新名称', p.name); if (name===null) return;
  const url = prompt('新 Base URL', p.base_url); if (url===null) return;
  try { await api('PUT', '/api/providers/'+id, { name, base_url: url }); refresh(); } catch(e){ toast(e.message); }
}
async function delProvider(id) {
  if (!confirm('删除该提供商及其所有 Key？')) return;
  try { await api('DELETE', '/api/providers/'+id); refresh(); } catch(e){ toast(e.message); }
}
async function addKey(id) {
  const cd = $('nc-'+id).value;
  try { await api('POST', `/api/providers/${id}/keys`, { key: $('nk-'+id).value, label: $('nl-'+id).value, cooldown_secs: cd ? +cd : null }); refresh(); }
  catch(e){ toast(e.message); }
}
async function delKey(pid, kid) {
  if (!confirm('删除该 Key？')) return;
  try { await api('DELETE', `/api/providers/${pid}/keys/${kid}`); refresh(); } catch(e){ toast(e.message); }
}
async function clearCooldown(kid) {
  try { await api('DELETE', `/api/keys/${kid}/cooldown`); refresh(); } catch(e){ toast(e.message); }
}
async function addAlias(id) {
  try { await api('POST', `/api/providers/${id}/aliases`, { alias: $('al-'+id).value, model: $('am-'+id).value }); refresh(); }
  catch(e){ toast(e.message); }
}
async function delAlias(id, alias) {
  try { await api('DELETE', `/api/providers/${id}/aliases/${encodeURIComponent(alias)}`); refresh(); } catch(e){ toast(e.message); }
}

async function addModel(id) {
  try { await api('POST', `/api/providers/${id}/models`, { id: $('nm-'+id).value }); $('nm-'+id).value=''; refresh(); }
  catch(e){ toast(e.message); }
}
async function delModel(id, mid) {
  if (!confirm(`删除模型 ${mid}？指向它的别名将无法使用。`)) return;
  try { await api('DELETE', `/api/providers/${id}/models/${encodeURIComponent(mid)}`); refresh(); } catch(e){ toast(e.message); }
}
async function toggleModel(id, mid) {
  try { await api('PUT', `/api/providers/${id}/models/${encodeURIComponent(mid)}`); refresh(); } catch(e){ toast(e.message); }
}
async function setAllowlist(id, on) {
  const p = STATUS.providers.find(x=>x.id===id);
  try { await api('PUT', '/api/providers/'+id, { name: p.name, base_url: p.base_url, model_allowlist_only: on }); toast(on ? '白名单模式已开启' : '白名单模式已关闭'); }
  catch(e){ toast(e.message); refresh(); }
}

async function fetchUpstreamModels(id) {
  const btn = event.target;
  btn.disabled = true; btn.textContent = '拉取中…';
  let models;
  try {
    const r = await api('GET', `/api/providers/${id}/upstream-models`);
    models = r.models || [];
  } catch(e) { toast('拉取失败: ' + e.message); btn.disabled=false; btn.textContent='从上游拉取'; return; }
  btn.disabled = false; btn.textContent = '从上游拉取';
  if (!models.length) { toast('上游未返回任何模型'); return; }

  const existing = new Set((STATUS.providers.find(x=>x.id===id).models||[]).map(m=>m.id));
  openModal(id, models, existing);
}

function openModal(pid, models, existing) {
  let overlay = document.getElementById('modal-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'modal-overlay';
    overlay.className = 'overlay';
    overlay.innerHTML = `<div class="box">
      <h3>导入模型</h3>
      <div class="row" style="margin:8px 0">
        <button class="small" onclick="modalToggleAll()">全选 / 全不选</button>
        <span class="faint" style="font-size:12px" id="modal-count"></span>
      </div>
      <div id="modal-list"></div>
      <div class="row" style="margin-top:14px;justify-content:flex-end">
        <button onclick="document.getElementById('modal-overlay').remove()">取消</button>
        <button class="primary" onclick="modalImport()">导入所选</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  }
  overlay.dataset.pid = pid;
  $('modal-list').innerHTML = models.map(m => `
    <label class="row" style="gap:8px;padding:5px 0;font-size:13px">
      <input type="checkbox" class="modal-cb" value="${esc(m)}" ${existing.has(m) ? '' : 'checked'}>
      <span class="keytag">${esc(m)}</span>
      ${existing.has(m) ? '<span class="faint" style="font-size:11px">已存在</span>' : ''}
    </label>`).join('');
  updateModalCount();
}
function updateModalCount() {
  const cbs = [...document.querySelectorAll('.modal-cb:checked')];
  $('modal-count').textContent = `已选 ${cbs.length} 个`;
}
function modalToggleAll() {
  const cbs = [...document.querySelectorAll('.modal-cb')];
  const allOn = cbs.every(c => c.checked);
  cbs.forEach(c => c.checked = !allOn);
  updateModalCount();
}
async function modalImport() {
  const overlay = document.getElementById('modal-overlay');
  const pid = overlay.dataset.pid;
  const models = [...document.querySelectorAll('.modal-cb:checked')].map(c => c.value);
  if (!models.length) { toast('未选择任何模型'); return; }
  try {
    const r = await api('POST', `/api/providers/${pid}/models/import`, { models });
    toast(`已导入 ${r.imported} 个模型`);
    overlay.remove();
    refresh();
  } catch(e){ toast(e.message); }
}

refresh();
setInterval(refresh, 5000); // pull fresh state from the server

// Local 1s countdown between refreshes: keeps the remaining-secs display live without
// extra requests, and flips a key back to 可用 the moment its cooldown hits 0.
setInterval(() => {
  if (!STATUS) return;
  const now = Date.now();
  document.querySelectorAll('.st.cool[data-until]').forEach(el => {
    const remain = Math.ceil((+el.dataset.until - now) / 1000);
    if (remain <= 0) { refresh(); return; }
    el.textContent = `冷却 · 剩余 ${remain}s`;
  });
}, 1000);
</script>
</body>
</html>
