<meta charset="utf-8">

<link rel="stylesheet" href="/static/sakura-fonts.css">
<link rel="stylesheet" href="/static/sakura-theme.css">
<link rel="stylesheet" href="/static/sakura-ui.css">
<style>
  /* Only components NOT in sakura-ui.css, all token-based (var() + rem), no hex/px. */
  .msg { position: fixed; bottom: 1.5rem; right: 1.5rem; background: var(--color-surface-raised);
    border: 1px solid var(--color-action-primary-hover); color: var(--color-text-primary);
    padding: 0.625rem 1rem; border-radius: 0.5rem; max-width: 26rem; box-shadow: var(--shadow-md);
    display: none; z-index: 50; font-size: 0.8125rem; }
  .msg.show { display: block; }
  .pdot { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%;
    background: var(--color-text-link); margin-right: 0.4375rem; vertical-align: middle; flex: none; }
  .pl-item .pdot { margin-right: 0; }
  button.danger { border-color: var(--color-action-destructive); color: var(--color-action-destructive); }
  button.danger:hover { border-color: var(--color-action-destructive-hover); color: var(--color-action-destructive-hover); background: var(--color-surface-raised); }
  .empty { padding: 1.5rem; text-align: center; color: var(--color-text-tertiary); }
  .overlay { position: fixed; inset: 0; background: var(--color-surface-overlay); display: flex;
    align-items: center; justify-content: center; z-index: 40; padding: 1.25rem; }
  .overlay .box { background: var(--color-surface-card); border: 1px solid var(--color-border-strong);
    border-radius: 0.75rem; width: 30rem; max-width: 100%; max-height: 72vh; overflow: auto; padding: 1.25rem; }
  .overlay h3 { font-size: 1.0625rem; font-weight: 700; margin-bottom: 0.75rem; }
  .modal-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.3125rem 0; font-size: 0.8125rem; }
  .kv-endpoints { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.5rem 1rem; font-size: 0.8125rem; }
  .kv-endpoints .k { color: var(--color-text-secondary); }
  .kv-endpoints code { cursor: pointer; color: var(--color-text-link); }
  .grp-entry { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
  .grp-entry select { min-width: 9rem; }
  .grp-entry input { flex: 1; min-width: 0; }
</style>
</head>

</div>

/* ============ helpers ============ */
async function api(method, url, body){
  const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
  if (!r.ok){ const e = await r.json().catch(()=>({})); throw new Error(e.error || (''+r.status)); }
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}
function toast(msg){ const m = $('msg'); m.textContent = msg; m.classList.add('show'); clearTimeout(m._t); m._t = setTimeout(()=>m.classList.remove('show'), 2600); }
function copyText(s, btn){
  const done = () => { if (!btn){ toast(t('已复制')); return; } const old = btn.textContent; btn.textContent = t('已复制'); setTimeout(()=>btn.textContent = old, 1200); };
  if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s).then(done).catch(()=>{}); }
  else { const ta = document.createElement('textarea'); ta.value = s; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e){} ta.remove(); }
}

/* ============ helpers: key/model status ============ */
function keyStatus(k){
  if (k.invalid){
    const rem = Math.max(0, Math.ceil((k.invalid.until_ms - STATUS.now_ms)/1000));
    return `<span class="st off" data-until="${k.invalid.until_ms}" data-kind="invalid">${t('无效 · 剩 ')}${rem}s</span>`;
  }
  if (k.cooling){
    const rem = Math.max(0, Math.ceil((k.cooling.until_ms - STATUS.now_ms)/1000));
    return `<span class="st cool" data-until="${k.cooling.until_ms}">${t('冷却 · 剩 ')}${rem}s</span>`;
  }
  return `<span class="st ok">${t('可用')}</span>`;
}

function akPaste(btn){ try { navigator.clipboard.readText().then(v=>{ const i=btn.parentElement.querySelector('input'); if(i) i.value=v; }).catch(()=>{}); } catch(e){} }

/* ---------- provider / key / model / alias actions ---------- */
async function saveProvider(id){
  try { await api('PUT', '/api/providers/'+id, { name: $('pe-name-'+id).value, base_url: $('pe-url-'+id).value, model_allowlist_only: $('pe-allow-'+id).checked }); toast(t('已保存')); await refresh(); }
  catch(e){ toast(t('失败: ')+e.message); }
}
async function delProvider(id){
  if (!confirm(t('删除该提供商及其所有 Key？'))) return;
  try { await api('DELETE', '/api/providers/'+id); await refresh(); toast(t('已保存')); }
  catch(e){ toast(t('失败: ')+e.message); }
}
async function addKey(id){
  const cd = $('nc-'+id).value;
  try { await api('POST', '/api/providers/'+id+'/keys', { key: $('nk-'+id).value, label: $('nl-'+id).value, cooldown_secs: cd?+cd:null }); $('nk-'+id).value=''; $('nl-'+id).value=''; $('nc-'+id).value=''; await refresh(); }
  catch(e){ toast(e.message); }
}
async function delKey(pid, kid){
  if (!confirm(t('删除该 Key？'))) return;
  try { await api('DELETE', '/api/providers/'+pid+'/keys/'+kid); await refresh(); }
  catch(e){ toast(e.message); }
}
async function clearCooldown(kid){
  try { await api('DELETE', '/api/keys/'+kid+'/cooldown'); await refresh(); }
  catch(e){ toast(e.message); }
}
async function addAlias(id){
  try { await api('POST', '/api/providers/'+id+'/aliases', { alias: $('al-'+id).value, model: $('am-'+id).value }); $('al-'+id).value=''; $('am-'+id).value=''; await refresh(); }
  catch(e){ toast(e.message); }
}
async function delAlias(id, alias){
  try { await api('DELETE', '/api/providers/'+id+'/aliases/'+encodeURIComponent(alias)); await refresh(); }
  catch(e){ toast(e.message); }
}
async function addModel(id){
  try { await api('POST', '/api/providers/'+id+'/models', { id: $('nm-'+id).value }); $('nm-'+id).value=''; await refresh(); }
  catch(e){ toast(e.message); }
}
async function delModel(id, mid){
  if (!confirm(t('删除模型 {m}？指向它的别名将无法使用。').replace('{m}', mid))) return;
  try { await api('DELETE', '/api/providers/'+id+'/models/'+encodeURIComponent(mid)); await refresh(); }
  catch(e){ toast(e.message); }
}
async function toggleModel(id, mid){
  try { await api('PUT', '/api/providers/'+id+'/models/'+encodeURIComponent(mid)); await refresh(); }
  catch(e){ toast(e.message); }
}
async function setAllowlist(id, on){
  const p = STATUS.providers.find(x=>x.id===id);
  try { await api('PUT', '/api/providers/'+id, { name: p.name, base_url: p.base_url, model_allowlist_only: on }); toast(t('已保存')); await refresh(); }
  catch(e){ toast(e.message); await refresh(); }
}

/* ---------- key show / copy (reveal raw key on explicit user action via export) ---------- */
async function findRealKey(keyId){
  const cfg = await api('GET', '/api/config/export');
  for (const p of (cfg.providers||[])) for (const k of (p.keys||[])) if (k.id === keyId) return k.key;
  return null;
}
async function toggleKey(keyId, btn){
  const tag = document.querySelector(`.keytag[data-key-id="${keyId}"]`);
  if (!tag) return;
  if (tag.dataset.revealed === '1'){
    const k = (STATUS&&STATUS.providers||[]).flatMap(p=>p.keys).find(k=>k.id===keyId);
    tag.textContent = k ? k.key : '••••'; tag.dataset.revealed = '0'; btn.textContent = t('显示'); return;
  }
  try {
    const real = await findRealKey(keyId);
    if (!real){ toast(t('未找到该 Key')); return; }
    tag.textContent = real; tag.dataset.revealed = '1'; btn.textContent = t('隐藏');
  } catch(e){ toast(t('复制失败: ')+e.message); }
}
async function copyKey(keyId, btn){
  try {
    const real = await findRealKey(keyId);
    if (!real){ toast(t('未找到该 Key')); return; }
    copyText(real, btn);
  } catch(e){ toast(t('复制失败: ')+e.message); }
}

/* ---------- upstream model fetch + import modal ---------- */
async function fetchUpstreamModels(id, btn){
  const old = btn.textContent; btn.disabled = true; btn.textContent = t('拉取中…');
  let models;
  try { const r = await api('GET', '/api/providers/'+id+'/upstream-models'); models = r.models || []; }
  catch(e){ toast(t('拉取失败: ')+e.message); btn.disabled=false; btn.textContent=old; return; }
  btn.disabled = false; btn.textContent = old;
  if (!models.length){ toast(t('上游未返回任何模型')); return; }
  const existing = new Set(((STATUS.providers.find(x=>x.id===id)||{}).models||[]).map(m=>m.id));
  openImportModal(id, models, existing);
}
function openImportModal(pid, models, existing){
  let overlay = document.getElementById('modal-overlay');
  if (!overlay){
    overlay = document.createElement('div'); overlay.id='modal-overlay'; overlay.className='overlay';
    overlay.innerHTML = `<div class="box">
      <h3>${t('模型导入')}</h3>
      <div class="row" style="margin:0.5rem 0"><button class="small" onclick="modalToggleAll()">${t('全选 / 全不选')}</button><span class="faint" id="modal-count"></span></div>
      <div id="modal-list"></div>
      <div class="row" style="margin-top:1rem;justify-content:flex-end"><button onclick="document.getElementById('modal-overlay').remove()">${t('取消')}</button><button class="primary" onclick="modalImport()">${t('导入所选')}</button></div>
    </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target===overlay) overlay.remove(); });
  }
  overlay.dataset.pid = pid;
  $('modal-list').innerHTML = models.map(m => `
    <label class="modal-row"><input type="checkbox" class="modal-cb" value="${esc(m)}" ${existing.has(m)?'':'checked'}><span class="keytag">${esc(m)}</span>${existing.has(m)?`<span class="faint">${t('已存在')}</span>`:''}</label>`).join('');
  updateModalCount();
}
function updateModalCount(){ const cbs=[...document.querySelectorAll('.modal-cb:checked')]; $('modal-count').textContent = t('已选 {n} 个').replace('{n}', cbs.length); }
function modalToggleAll(){ const cbs=[...document.querySelectorAll('.modal-cb')]; const allOn=cbs.every(c=>c.checked); cbs.forEach(c=>c.checked=!allOn); updateModalCount(); }
async function modalImport(){
  const overlay = document.getElementById('modal-overlay'); const pid = overlay.dataset.pid;
  const models = [...document.querySelectorAll('.modal-cb:checked')].map(c=>c.value);
  if (!models.length){ toast(t('未选择任何模型')); return; }
  try { const r = await api('POST', '/api/providers/'+pid+'/models/import', { models }); toast(t('已导入 {n} 个模型').replace('{n}', r.imported||0)); overlay.remove(); await refresh(); }
  catch(e){ toast(e.message); }
}

  const d = S.addDraft;
  if(!d || !d.name.trim() || !d.base_url.trim() || !d.key.trim()) return;
  try {
    const cfg = await api('POST', '/api/providers', { name:d.name.trim(), base_url:d.base_url.trim(), protocol:d.protocol });
    const prov = (cfg.providers||[]).find(x=>x.name===d.name.trim());
    if (!prov) throw new Error('provider create failed');
    const pid = prov.id;
    await api('POST', '/api/providers/'+pid+'/keys', { key:d.key.trim(), label:'' });
    for (const mId of d.models){ try { await api('POST', '/api/providers/'+pid+'/models', { id:mId }); } catch(e){ /* ignore duplicate-model conflicts */ } }
    S.addState=null; S.addDraft=null; S.localProv=pid; S.tab='providers';
    await refresh(); renderSidebar(); toast(t('添加成功'));
  } catch(e){ toast(t('添加失败: ')+e.message); }

    <h2 class="board-title">${t('模型')}</h2>
    <div class="board-note">${t('模型信息：所有模型条目大列表 · 模型组跨提供商编组')}</div>
    <div class="subtabs">
      <button class="${S.modelTab==='info'?'active':''}" onclick="setModelTab('info')">${t('模型信息')}</button>
      <button class="${S.modelTab==='groups'?'active':''}" onclick="setModelTab('groups')">${t('模型组管理')}</button>
    </div>
    <div id="model-pane"></div>`;
  if (S.modelTab==='info') renderModelList($('model-pane'));
  else renderModelGroups($('model-pane'));
}
function setModelTab(tab){ S.modelTab=tab; S.groupEdit=null; renderMain(); }
function renderModelList(c){
  const provs = STATUS.providers || [];
  const fchips = [['all', t('全部')]].concat(provs.map(p=>[p.id, p.name]));
  const list = [];
  provs.forEach(p => (p.models||[]).forEach(mm => list.push({ pid:p.id, m:mm })));
  const shown = S.modelFilter==='all' ? list : list.filter(x=>x.pid===S.modelFilter);
  c.innerHTML = `
    <div class="chips" style="margin:1rem 0">
      ${fchips.map(fc=>`<span class="chip ${S.modelFilter===fc[0]?'active':''}" onclick="S.modelFilter='${fc[0]}';renderMain()" role="button" tabindex="0">${esc(fc[1])}</span>`).join('')}
    </div>
    <div class="mc-grid">
      ${shown.length ? shown.map(({pid,m})=>{
        const p = provs.find(x=>x.id===pid);
        const aliases = Object.entries(p.aliases||{}).filter(([a,mm])=>mm===m.id).map(([a])=>a);
        return `
        <div class="mc ${m.enabled?'':'disabled'}" onclick="toggleModel('${pid}','${esc(m.id)}')">
          <div class="mc-top"><div>
            <div class="mc-name">${esc(m.id)}</div>
            <div class="mc-prov">${esc(p.name)}${aliases.length?` · ↔ ${aliases.map(esc).join(', ')}`:''}</div>
          </div>
          <span class="mc-sw ${m.enabled?'on':''}" onclick="event.stopPropagation();toggleModel('${pid}','${esc(m.id)}')" title="${t('启用/禁用')}"><span class="track"></span><span class="slabel">${m.enabled?t('启用'):t('禁用')}</span></span></div>

}

function renderGroupEditor(c){
  const e = S.groupEdit; const provs = STATUS.providers || [];
  const provOpts = provs.map(p=>`<option value="${p.id}" ${e.entries.length&&e.entries[0].pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('');

        <div id="grp-entries">
          ${e.entries.map((en,i)=>groupEntryRow(i, en, provs)).join('')}

function groupEntryRow(i, en, provs){
  return `<div class="grp-entry">
    <select aria-label="${t('provider')}" id="grp-pid-${i}">${provs.map(p=>`<option value="${p.id}" ${en&&en.pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <input class="mono" aria-label="${t('upstream model')}" id="grp-um-${i}" value="${esc(en?en.model:'')}" placeholder="${t('upstream model')}">
    <button class="small danger" onclick="removeGroupMember(${i})">${t('删除')}</button>
  </div>`;
}
function newGroup(){ S.groupEdit={ isNew:true, id:'', entries:[{pid:(STATUS.providers[0]||{}).id||'', model:''}] }; renderMain(); }
function editGroup(i){ const g=(MODEL_GROUPS||[])[i]; if(!g) return; S.groupEdit={ isNew:false, id:g.id, index:i, entries:(g.entries||[]).map(e=>({pid:e[0], model:e[1]})) }; if(!S.groupEdit.entries.length) S.groupEdit.entries.push({pid:(STATUS.providers[0]||{}).id||'', model:''}); renderMain(); }
function addGroupMember(){ const e=S.groupEdit; e.entries.push({pid:(STATUS.providers[0]||{}).id||'', model:''}); renderMain(); }
function removeGroupMember(i){ S.groupEdit.entries.splice(i,1); renderMain(); }
function collectGroupEntries(){
  const e=S.groupEdit; const out=[];
  for (let i=0;i<e.entries.length;i++){
    const pid=$('grp-pid-'+i), um=$('grp-um-'+i);
    if (pid&&um){ const p=pid.value.trim(), u=um.value.trim(); if (p&&u) out.push([p,u]); }
  }
  return out;
}
async function saveGroup(){
  const e=S.groupEdit; const id=$('grp-id').value.trim();
  if (!id){ toast(t('组名')); return; }
  const entries = collectGroupEntries();
  let groups = (MODEL_GROUPS||[]).map(g=>({id:g.id, entries:(g.entries||[]).map(x=>[x[0],x[1]])}));
  if (e.isNew){ if (groups.some(g=>g.id===id)){ toast(t('失败: ')+'duplicate'); return; } groups.push({id, entries}); }
  else { groups[e.index] = {id, entries}; }
  try { await api('PUT', '/api/model-groups', { groups }); MODEL_GROUPS = await api('GET', '/api/model-groups'); S.groupEdit=null; toast(t('已保存')); renderMain(); }
  catch(err){ toast(t('失败: ')+err.message); }
}
async function delGroup(i){
  if (!confirm(t('删除该模型组？'))) return;
  let groups = (MODEL_GROUPS||[]).map(g=>({id:g.id, entries:(g.entries||[]).map(x=>[x[0],x[1]])}));
  groups.splice(i,1);
  try { await api('PUT', '/api/model-groups', { groups }); MODEL_GROUPS = await api('GET', '/api/model-groups'); toast(t('已保存')); renderMain(); }
  catch(err){ toast(t('失败: ')+err.message); }
}

async function akAdd(batch){
  const sel=document.getElementById('ak-prov'), inp=document.getElementById('ak-key-input');
  if(!sel||!inp) return;
  const pid=sel.value, raw=inp.value.trim(); if(!raw) return;
  const keys = batch ? raw.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean) : [raw];
  for (const k of keys){ try { await api('POST', '/api/providers/'+pid+'/keys', { key:k, label:'' }); } catch(e){ toast(t('部分 Key 添加失败: ')+e.message); } }
  inp.value=''; await refresh();
}
async function akDelInvalid(){
  const provs = STATUS.providers || [];
  for (const p of provs) for (const k of (p.keys||[])) if (k.invalid){ try { await api('DELETE', '/api/providers/'+p.id+'/keys/'+k.id); } catch(e){} }
  await refresh();
}

/* ============ strategy (filters + sort + dry-run via API) ============ */
function modeName(){
  const { groupLock, provLock } = S;
  if (groupLock && provLock)  return t('精确 (provider,model) 轮换 Key - 当前行为，零惊喜');
  if (groupLock && !provLock) return t('模型优先 - 跨提供商同模型');
  if (!groupLock && provLock) return t('提供商优先 - 换模型');
  return t('可用优先 - 所有候选');
}
function modeShort(){
  const { groupLock, provLock } = S;
  if (groupLock && provLock)  return t('精确轮换');
  if (groupLock && !provLock) return t('模型优先');
  if (!groupLock && provLock) return t('提供商优先');
  return t('可用优先');
}

function resultBanner(res){
  if (res.result==='routed' && res.routed)
    return `<div class="result-banner routed"><span class="big">${t('路由命中')}</span> <span class="keytag">${esc(res.routed.api_key_id)}</span> · ${esc(PNAME(res.routed.provider_id))} / ${esc(res.routed.upstream_model)}</div>`;
  if (res.result==='all_cooling')
    return `<div class="result-banner err429"><span class="big">${t('429 全冷却')}</span> ${t('返回')} <code>Retry-After: ${res.retry_after!=null?res.retry_after+'s':'-'}</code></div>`;
  if (res.result==='no_valid')
    return `<div class="result-banner err429"><span class="big">${t('429 无可用')}</span> ${t('候选 {n} 条均无效').replace('{n}', (res.candidates||[]).length)}</div>`;
  return `<div class="result-banner err429"><span class="big">${t('429 候选为空')}</span> ${t('当前过滤下无候选')}</div>`;
}
async function onFilterChange(){
  const checks = document.querySelectorAll('.toggle-row input[type=checkbox]');
  S.groupLock = checks[0] ? checks[0].checked : S.groupLock;
  S.provLock = checks[1] ? checks[1].checked : S.provLock;
  await putStrategy(); await runDryRun(); renderMain();
}
async function onSortChange(i, val){ S.sorts[i]=val; await putStrategy(); await runDryRun(); renderMain(); }
async function onReqModelChange(val){ S.reqModel=val; await runDryRun(); renderMain(); }
async function onReqProvChange(val){ S.reqProv=val; await runDryRun(); renderMain(); }
async function putStrategy(){
  try {
    await api('PUT', '/api/strategy', { filter:{ lock_model_group:S.groupLock, lock_provider:S.provLock }, sort:S.sorts.filter(Boolean) });
    STRATEGY = await api('GET', '/api/strategy');
    S.groupLock = STRATEGY.filter.lock_model_group; S.provLock = STRATEGY.filter.lock_provider;
    S.sorts = [STRATEGY.sort[0]||'', STRATEGY.sort[1]||'', STRATEGY.sort[2]||''];
  } catch(e){ toast(t('失败: ')+e.message); }
}
async function runDryRun(){
  if (!S.reqModel) return;
  try {
    DRY = await api('POST', '/api/strategy/dry-run', {
      model: S.reqModel,
      provider: S.reqProv && S.reqProv!=='不限' ? S.reqProv : undefined,
      sorts: S.sorts.filter(Boolean)
    });
  } catch(e){ DRY=null; toast(t('失败: ')+e.message); }
}

async function saveSettings(){
  try {
    await api('PUT', '/api/settings', {
      default_cooldown_secs: +$('s-cooldown').value || 60,
      max_attempts: +$('s-attempts').value || 3,
      api_port: +$('s-apiport').value || 8000,
      ui_port: +$('s-uiport').value || 8001,
      auth: { enabled: $('s-auth').checked, keys: $('s-authkeys').value.split(',').map(s=>s.trim()).filter(Boolean) }
    });
    toast(t('已保存')); await refresh();
  } catch(e){ toast(t('失败: ')+e.message); }
}
function exportConfig(){ window.open('/api/config/export', '_blank'); toast(t('已触发下载')); }
async function importConfig(ev){
  const file = ev.target.files[0]; ev.target.value=''; if (!file) return;
  if (!confirm(t('导入 {n} 将整体替换当前配置（含端口与鉴权设置），确定继续？').replace('{n}', file.name))) return;
  try {
    const content = await file.text(); JSON.parse(content);
    await api('POST', '/api/config/import', { content });
    toast(t('导入成功，已热生效')); await refresh();
  } catch(e){ toast(t('导入失败: ')+e.message); }
}

/* ============ refresh loop ============ */
async function refresh(){
  try {
    STATUS = await api('GET', '/api/status');
    STATS = await api('GET', '/api/stats');
    CATALOG = await api('GET', '/api/free-catalog');
    STRATEGY = await api('GET', '/api/strategy');
    MODEL_GROUPS = await api('GET', '/api/model-groups');
    // mirror the saved strategy into the UI state (edits PUT immediately, so this stays in sync)
    S.groupLock = STRATEGY.filter.lock_model_group;
    S.provLock = STRATEGY.filter.lock_provider;
    S.sorts = [STRATEGY.sort[0]||'', STRATEGY.sort[1]||'', STRATEGY.sort[2]||''];
    renderTopbar(); renderSideFoot(); renderMain();
    // keep the dry-run candidate table live while viewing the strategy board
    if (S.tab==='strategy' && DRY) runDryRun().then(()=>renderMain());
  } catch(e){ console.error('refresh failed', e); }
}

/* sidebar collapse */
$('hamburger').addEventListener('click', ()=>{
  S.collapsed = !S.collapsed;
  $('sidebar').classList.toggle('collapsed', S.collapsed);
});

/* boot — lang + theme init deferred to here so the data globals (STATUS / S /
   NAV …) are declared before applyLang/applyTheme trigger the first render
   (the inline IIFEs that used to run mid-script hit a temporal-dead-zone error
   on STATUS). */
(function boot(){
  let sl = null; try { sl = localStorage.getItem(LANG_KEY); } catch(e){}
  applyLang(sl || (navigator.language && navigator.language.startsWith('zh') ? 'zh' : 'en'));
  let st = null; try { st = localStorage.getItem(THEME_KEY); } catch(e){}
  applyTheme(st === 'light' ? 'light' : 'dark');
  // applyLang/applyTheme above already render the shell (STATUS==null → main
  // empty); refresh() loads the data and re-renders.
  refresh();
  setInterval(refresh, 5000);
})();
// 1s countdown keeps cooling/invalid remaining-secs live between refreshes.
setInterval(()=>{
  if (!STATUS) return;
  const now = Date.now();
  let expire = false;
  document.querySelectorAll('.st.cool[data-until], .st.off[data-until]').forEach(el => {
    const remain = Math.ceil((+el.dataset.until - now)/1000);
    if (remain <= 0){ expire = true; return; }
    el.textContent = (el.dataset.kind==='invalid' ? t('无效 · 剩 ') : t('冷却 · 剩 ')) + remain + 's';
  });
  if (expire) refresh();
}, 1000);
</script>
