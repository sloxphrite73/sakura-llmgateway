name: Release

# Build the single-file Windows binary (embedded UI via rust-embed) and the
# universal Android APK, and attach both to a GitHub Release.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            llm-gateway/target
          key: cargo-release-${{ hashFiles('llm-gateway/Cargo.lock') }}
          restore-keys: cargo-release-

      - name: Build release binary
        working-directory: llm-gateway
        run: cargo build --release

      - name: Smoke test (binary starts and serves UI)
        working-directory: llm-gateway
        shell: pwsh
        run: |
          # test/ may not exist on the CI checkout (its only file is gitignored),
          # so write the generated config to the working-dir root instead.
          $cfg = '{"api_port":8801,"ui_port":8800,"providers":[{"id":"mock","name":"mock","base_url":"http://127.0.0.1:1/v1","models":[{"id":"demo","enabled":true}],"keys":[{"id":"k1","key":"sk-placeholder","label":"ci","cooldown_secs":null}]}]}'
          Set-Content -Path "ci-gateway.json" -Value $cfg -Encoding utf8NoBOM
          $proc = Start-Process -FilePath "target/release/llm-gateway.exe" -ArgumentList "--config","ci-gateway.json" -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8800/" -UseBasicParsing -TimeoutSec 10
            if ($r.StatusCode -ne 200) { throw "UI check failed: HTTP $($r.StatusCode)" }
            Write-Host "Smoke test passed: UI served with HTTP 200"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Rename artifact
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/","" } else { "dev" }
          Copy-Item "llm-gateway/target/release/llm-gateway.exe" "sakura-llmgateway-$version-x86_64-pc-windows-msvc.exe"
          Write-Host "Artifact: sakura-llmgateway-$version-x86_64-pc-windows-msvc.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: sakura-llmgateway-*-x86_64-pc-windows-msvc.exe
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            llm-gateway/target
          key: cargo-android-${{ hashFiles('llm-gateway/Cargo.lock') }}
          restore-keys: cargo-android-

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install NDK
        run: |
          # The runner image ships a full Android SDK; the setup-android action is
          # skipped because its current releases fail on images whose cmdline-tools
          # dropped the legacy 'tools' package. Just accept licenses and install NDK.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" > /dev/null
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cross-compile gateway for three Android ABIs
        working-directory: llm-gateway
        run: |
          echo "NDK home: $ANDROID_NDK_LATEST_HOME"
          # NOTE: -P (capital) = platform/API level in cargo-ndk 4.x; -p means --package.
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 26 \
            --manifest-path Cargo.toml -- build --release --locked

      - name: Place gateway binaries into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a \
                   android/app/src/main/jniLibs/armeabi-v7a \
                   android/app/src/main/jniLibs/x86_64
          cp llm-gateway/target/aarch64-linux-android/release/llm-gateway android/app/src/main/jniLibs/arm64-v8a/libllmgateway.so
          cp llm-gateway/target/armv7-linux-androideabi/release/llm-gateway android/app/src/main/jniLibs/armeabi-v7a/libllmgateway.so
          cp llm-gateway/target/x86_64-linux-android/release/llm-gateway android/app/src/main/jniLibs/x86_64/libllmgateway.so
          chmod +x android/app/src/main/jniLibs/*/libllmgateway.so
          ls -la android/app/src/main/jniLibs/*/

      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_B64 != ''
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/keystore.jks
          echo "keystore decoded: $(wc -c < android/app/keystore.jks) bytes"

      - name: Build signed universal APK
        working-directory: android
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${TAG#v}"
          VERSION_CODE=$(git rev-list --count HEAD)
          if [ -f app/keystore.jks ]; then
            echo "Building signed release APK"
            gradle assembleRelease \
              -PversionName="$VERSION_NAME" \
              -PversionCode="$VERSION_CODE" \
              -Pandroid.keystore.path=keystore.jks \
              -Pandroid.keystore.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              -Pandroid.keystore.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
              -Pandroid.keystore.keypassword="${{ secrets.ANDROID_KEY_PASSWORD }}"
          else
            echo "WARNING: no keystore secret set - building UNSIGNED APK"
            gradle assembleRelease \
              -PversionName="$VERSION_NAME" \
              -PversionCode="$VERSION_CODE"
          fi

      - name: Rename artifact
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             "sakura-llmgateway-${TAG}-universal.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: sakura-llmgateway-*-universal.apk
          if-no-files-found: error

  release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sakura-llmgateway-*-x86_64-pc-windows-msvc.exe
            dist/sakura-llmgateway-*-universal.apk
